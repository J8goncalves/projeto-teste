name: org-v5-governance
on:
  push:
    branches: ['feat/**', 'feature/**', 'main']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate organizational structure
        run: python .agents/scripts/org_check.py
      - name: Run real unit/integration governance tests
        run: python -m unittest discover -s tests -v
      - name: Run JavaScript unit tests
        run: node tests/test_task_manager.js
      - name: Compile Python files
        run: python -m compileall -q org_v5 tests
      - name: Check retired V4 stubs fail closed
        shell: bash
        run: |
          if python .agents/scripts/state.py transition --to BUILD; then echo 'V4 bypass' ; exit 1 ; fi
          if python .agents/scripts/memory_ops.py brief --role qa; then echo 'V4 fake memory' ; exit 1 ; fi
